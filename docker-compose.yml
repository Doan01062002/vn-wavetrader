services:
  wavetrader:
    build:
      context: .
      dockerfile: Dockerfile
    image: vn-wavetrader:latest
    container_name: wavetrader_prod
    restart: unless-stopped

    # Nạp toàn bộ biến môi trường từ file .env (không commit file này vào Git!)
    env_file:
      - .env

    # Mount volume thư mục để lưu logs và data
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

    # Logging với rotation để tránh disk đầy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Giới hạn tài nguyên (tránh process run away)
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          memory: 128M

    # Healthcheck: kiểm tra process container phản hồi
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Timezone Việt Nam
    environment:
      - TZ=Asia/Ho_Chi_Minh

networks:
  default:
    name: wavetrader_net
