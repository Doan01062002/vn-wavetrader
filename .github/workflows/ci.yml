name: VN-WaveTrader CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest matplotlib
    
    - name: Run linting (basic syntax check)
      run: |
        python -m py_compile main.py
        python -m py_compile config.py
        for f in src/*.py; do python -m py_compile "$f"; done
    
    - name: Run unit tests
      env:
        # Dummy env vars for tests that import modules needing these
        TELEGRAM_BOT_TOKEN: "test_token"
        TELEGRAM_CHAT_ID: "test_chat_id"
        GROQ_API_KEY: "test_key"
        SUPABASE_DB_HOST: "localhost"
        SUPABASE_DB_NAME: "test"
        SUPABASE_DB_USER: "test"
        SUPABASE_DB_PASSWORD: "test"
      run: |
        python -m pytest test_monitor.py -v --tb=short || true

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t vn-wavetrader:latest .
    
    - name: Verify Docker image
      run: docker images vn-wavetrader:latest
